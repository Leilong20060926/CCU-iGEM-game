<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoFold</title>
  <link rel="stylesheet" href="public/css/base.css">
  <link rel="stylesheet" href="public/css/layout.css">
  <link rel="stylesheet" href="public/css/dialogue.css">
  <link rel="stylesheet" href="public/css/choices.css">
  <link rel="stylesheet" href="public/css/page-index.css">
  <link rel="stylesheet" href="public/css/pages-menu.css">
  <link rel="stylesheet" href="public/css/loading.css">
  <link rel="stylesheet" href="public/css/page-egg.css">
  <link rel="stylesheet" href="public/css/page-doc.css">
  <link rel="stylesheet" href="public/css/page-info.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-TE3GEQVKKJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-TE3GEQVKKJ');

</head>
<body>

  <!-- ══ LOADING SCREEN ══ -->
  <div id="loadingScreen">
    <script>if(localStorage.getItem('darkMode')==='true')document.getElementById('loadingScreen').classList.add('dark');</script>
    <div class="loading-logo">NoFold</div>
    <div class="loading-bar-wrap">
      <div class="loading-bar-fill" id="loadingBarFill"></div>
    </div>
    <div class="loading-text" id="loadingText">Loading... 0%</div>
  </div>


  <!-- ══════════════════════════════════════════
       SHARE SHEET OVERLAY
  ══════════════════════════════════════════ -->

  <!-- ══════════════════════════════════════════
       Shared UI (Sidebar + Controls)
  ══════════════════════════════════════════ -->
  <!-- "Got it" prompt shown after the promo animation ends -->
  <div class="game-tip-overlay" id="endingAnimTip">
    <div class="game-tip-box">
      <div class="game-tip-icon">!</div>
      <div class="game-tip-title" data-zh="溫馨提醒" data-en="Reminder">溫馨提醒</div>
      <div class="game-tip-content" id="endingAnimTipContent"
        data-zh="以上內容為真實數據與研究成果。<br><br>希望透過《NoFold》，讓你重新思考農藥、糧食與環境的關係。<br><br>你的每一次選擇，都在影響未來。"
        data-en="The above content is based on real data and research findings.<br><br>We hope NoFold inspires you to rethink the relationship between pesticides, food, and the environment.<br><br>Every choice you make shapes the future.">
        以上內容為真實數據與研究成果。<br><br>希望透過《NoFold》，讓你重新思考農藥、糧食與環境的關係。<br><br>你的每一次選擇，都在影響未來。
      </div>
      <button id="endingAnimTipBtn" style="
        background:#E8C060;border:1px solid #B8860B;border-radius:12px;
        padding:10px 28px;font-size:1rem;font-weight:700;cursor:pointer;
        margin:0 auto;display:block;transition:background 0.2s;
      "
        data-zh="我知道了" data-en="Got it!"
        onmouseover="this.style.background='#ffe666'"
        onmouseout="this.style.background='#E8C060'"
      >我知道了</button>
    </div>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <nav class="sidebar" id="sidebar">
    <ul class="sidebar-menu">
      <li><a onclick="resumeGame()" id="backToGameBtn"><img src="public/menu/left.svg" alt="" class="menu-icon"/><span data-zh="回到遊戲" data-en="Back to Game">回到遊戲</span></a></li>
      <li><a onclick="navTo('ending-anim', true)"><img src="public/menu/tv-retro.svg" alt="" class="menu-icon"/><span data-zh="宣傳動畫" data-en="Promo Animation">宣傳動畫</span></a></li>
      <li><a onclick="navTo('star')"><img src="public/menu/star.svg" alt="" class="menu-icon"/><span data-zh="收集結局" data-en="Endings">收集結局</span></a></li>
      <li><a onclick="navTo('egg')"><img src="public/menu/egg.svg" alt="" class="menu-icon"/><span data-zh="遊戲彩蛋" data-en="Easter Eggs">遊戲彩蛋</span></a></li>
      <li><a onclick="navTo('doc')"><img src="public/menu/doc.svg" alt="" class="menu-icon"/><span data-zh="相關資訊" data-en="Information">相關資訊</span></a></li>
      <li><a onclick="navTo('info')"><img src="public/menu/info.svg" alt="" class="menu-icon"/><span data-zh="關於我們" data-en="About Us">關於我們</span></a></li>
    </ul>
  </nav>
  <div class="top-left-controls">
    <button class="btn" id="alignBtn" aria-label="Align left">
      <img id="alignIcon" src="public/menu/align-left.svg" alt="Align left" />
    </button>
  </div>
  <div class="controls">
    <button class="btn" id="darkModeBtn" aria-label="Toggle dark mode" title="深夜模式">
      <img id="darkModeIcon" src="public/menu/moon.svg" alt="dark mode" />
    </button>
    <button class="btn" id="musicBtn" aria-label="Toggle music">
      <img id="musicIcon" src="public/menu/music.svg" alt="Music" />
    </button>
    <button class="btn" id="langBtn" aria-label="Toggle language">
      <span id="langText">ZH</span>
    </button>
  </div>

  <!-- Page content is loaded at runtime from pages/*.html fragments, see the loader below -->
  <div id="page-index-slot"></div>
  <div id="page-char1-slot"></div>
  <div id="page-char2-slot"></div>
  <div id="page-char3-slot"></div>
  <div id="page-ending-anim-slot"></div>
  <div id="page-star-slot"></div>
  <div id="page-egg-slot"></div>
  <div id="page-doc-slot"></div>
  <div id="page-info-slot"></div>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
  <script>
  /* ══════════════════════════════════════════
     LOADER: fetch all page HTML fragments first,
     inject them into the DOM, then load the game
     logic JS in order (the order must not change)
  ══════════════════════════════════════════ */
  (async function () {
    const pageIds = ['index','char1','char2','char3','ending-anim','star','egg','doc','info'];

    await Promise.all(pageIds.map(async id => {
      const res = await fetch(`pages/page-${id}.html`);
      if (!res.ok) throw new Error(`無法載入 pages/page-${id}.html`);
      const html = await res.text();
      const slot = document.getElementById(`page-${id}-slot`);
      slot.outerHTML = html;
    }));

    const scripts = [
      'public/js/core.js',
      'public/js/router.js',
      'public/js/stats-hud.js',
      'public/js/shared-controls.js',
      'public/js/page-index.js',
      'public/js/character1.js',
      'public/js/character2.js',
      'public/js/character3.js',
      'public/js/ending-animation.js',
      'public/js/page-egg.js',
      'public/js/page-star.js',
      'public/js/share.js',
    ];

    for (const src of scripts) {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error(`無法載入 ${src}`));
        document.body.appendChild(s);
      });
    }

    // Only start the game once all page fragments and JS are ready
    // (this init used to run on DOMContentLoaded, but that event has
    //  already fired by now, so we call initApp() explicitly instead —
    //  see public/js/shared-controls.js)
    window.initApp();
  })();
  </script>

</body>
</html>

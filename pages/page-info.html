      <div class="info-news-title" data-zh="簡介" data-en="About Us">簡介</div>
      <p class="info-news-body" data-zh="我們是 No Fold，CCU-Taiwan iGEM 團隊，由國立中正大學各學院的學生所組成，涵蓋理學院、工學院、社會科學院、文學院，以及跨領域學士學位學程的同學。" data-en="We are No Fold, the CCU-Taiwan iGEM team, composed of students from various colleges at National Chung Cheng University, including the College of Science, College of Engineering, College of Social Sciences, College of Humanities, and the Interdisciplinary Bachelor's Degree Program.">我們是 No Fold，CCU-Taiwan iGEM 團隊，由國立中正大學各學院的學生所組成，涵蓋理學院、工學院、社會科學院、文學院，以及跨領域學士學位學程的同學。</p>
      <p class="info-news-body" data-zh="我們團隊計畫利用生物合成學的方式，開發可用於驅趕農業害蟲瘤野螟的系統，希望大家了解農藥對世界的危害以及增進大眾對有機稻米的認知。" data-en="Our team plans to use synthetic biology to develop a system that can repel the agricultural pest striped rice borer. We hope to raise awareness about the harm pesticides cause to the world and promote public understanding of organic rice.">我們團隊計畫利用生物合成學的方式，開發可用於驅趕農業害蟲瘤野螟的系統，希望大家了解農藥對世界的危害以及增進大眾對有機稻米的認知。</p>
